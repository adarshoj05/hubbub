<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hubbub - the new space for hangouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="feed">
<div class="app">
 <nav class="panel nav" aria-label="Main">
  <div class="logo"><i></i><span>hubbub</span></div>
  <button aria-current="page" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-go="explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span>Explore</span></button>
  <button data-go="alerts"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>Alerts</span><b class="badge" id="badge"></b></button>
  <button id="navChat" data-go="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg><span>Messages</span></button>
  <button class="post-btn" id="focusPost"><span>New post</span></button>
  <div class="me"><div class="av a5">AD</div><div><b>Adarsh</b><small>@adarsh</small></div></div>
  <button class="theme" id="theme">Switch light / dark</button>
 </nav>

 <main class="panel feed" aria-label="Feed">
  <div class="feed-scroll" id="v-home">
   <div class="stories" aria-label="Stories">
    <div class="story"><div class="av a1">+</div>Your story</div>
    <div class="story"><div class="av a2">MI</div>Mira</div>
    <div class="story"><div class="av a3">KA</div>Kabir</div>
    <div class="story seen"><div class="av a4">JO</div>Joel</div>
    <div class="story"><div class="av a5">NE</div>Neha</div>
    <div class="story seen"><div class="av a1">SA</div>Sana</div>
   </div>
   <div class="composer">
    <div class="av a5">AD</div>
    <div style="flex:1">
     <textarea id="draft" rows="2" maxlength="200" placeholder="What did you build today?" aria-label="Write a post"></textarea>
     <div class="row"><span class="count" id="count">200 left</span><button class="btn" id="publish" disabled>Post</button></div>
    </div>
   </div>
   <div id="posts" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
  <div class="feed-scroll" id="v-explore" hidden>
   <h2 class="vt">Explore</h2>
   <input class="search" id="search" type="search" placeholder="Search topics and people" aria-label="Search topics and people">
   <section><h3>Trending on campus</h3><div id="trends"></div></section>
   <section><h3>People to follow</h3><div id="people"></div></section>
   <section><h3>Fresh from the community</h3><div class="grid" id="grid"></div></section>
  </div>
  <div class="feed-scroll" id="v-alerts" hidden>
   <div class="vh"><h2 class="vt">Alerts</h2><button class="btn" id="readAll">Mark all read</button></div>
   <div class="seg" role="group" aria-label="Filter alerts"><button data-f="all" aria-pressed="true">All</button><button data-f="mention" aria-pressed="false">Mentions</button><button data-f="like" aria-pressed="false">Likes</button><button data-f="follow" aria-pressed="false">Follows</button></div>
   <div id="alerts"></div>
  </div>
 </main>

 <aside class="panel chat" aria-label="Messages">
  <div class="chat-head"><h2>Messages</h2></div>
  <div class="convos" id="convos"></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="send" id="form"><input id="msgIn" placeholder="Message Mira" aria-label="Message" autocomplete="off"><button class="btn">Send</button></form>
 </aside>
</div>
<div class="tabs"><button data-go="home">Home</button><button data-go="explore">Explore</button><button data-go="alerts">Alerts</button><button data-go="chat">Chat</button></div>

<script src="main.js"></script>
</body>
</html>
